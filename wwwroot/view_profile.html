<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <header class="content-header">
        <div class="container">
            <h1>Thông Tin Cá Nhân</h1>
        </div>
    </header>

    <!-- User Profile Overview -->
    <section class="profile-overview">

            <div class="profile-details">
                <div class="left-side">
                    <div class="profile-image">
                        <img src="images/icons/user_profile.png" alt="User Profile">
                    </div>
                    <div class="username">
                        <h2>Huỳnh Bảo Quyên</h2>
                    </div>
                </div>

                <div class="right-side">
                    <p><strong>Họ Và Tên:</strong> <span id="userFullName">Huỳnh Bảo Quyên</span></p>
                    <p><strong>Nơi Làm Việc:</strong> <span id="userWorkplace">Trường Đại học Bách Khoa - Đại học Đà Nẵng</span></p>
                    <p><strong>Độ Tuổi:</strong> <span id="userAge">20</span></p>
                    <p><strong>Số Điện Thoại:</strong> <span id="userPhone">0935130946</span></p>
                    <p><strong>Email:</strong> <span id="userEmail">hbquyen2812@gmail.com</span></p>
                    <p><strong>Giới Tính:</strong> <span id="userGender">Nữ</span></p>
                </div>

            </div>

            <a href="edit_profile.html" class="btn-edit-profile">Chỉnh Sửa Thông Tin</a>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>


    <!-- custom js file link -->
    <script src="js/loadContent.js" defer></script>
    <script src="js/script.js" defer></script>

</body>
</html>
