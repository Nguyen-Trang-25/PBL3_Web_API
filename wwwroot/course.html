<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp mới</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Account Form -->
    <div id="reg-log-container"></div>

    <main class="main new-classes-page">

        <section class="section filter-section">
            <!-- Advanced Filters -->
            <div class="advanced-filters">
                <h3 class="filter-title">
                    <i class="fas fa-sliders-h"></i>
                    Bộ lọc chi tiết
                </h3>

                <form id="filter-form">
                    <div class="filter-grid">
                        <div class="filter-group">
                            <label>
                                <i class="fas fa-map-marker-alt"></i>
                                Khu vực
                            </label>
                            <select name="area">
                                <option value="">Tất cả khu vực</option>
                                <option value="NHS">Ngũ Hành Sơn</option>
                                <option value="LC">Liên Chiểu</option>
                                <option value="HC">Hải Châu</option>
                                <option value="ST">Sơn Trà</option>
                                <option value="CL">Cẩm Lệ</option>
                                <option value="TK">Thanh Khê</option>
                                <option value="HV">Hòa Vang</option>
                                <option value="HS">Hoàng Sa</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label>
                                <i class="fas fa-laptop"></i>
                                Hình thức
                            </label>
                            <select name="method">
                                <option value="">Tất cả hình thức</option>
                                <option value="offline">Offline</option>
                                <option value="online">Online</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label>
                                <i class="fas fa-user"></i>
                                Giới tính gia sư
                            </label>
                            <select name="tutor_gender">
                                <option value="">Không yêu cầu</option>
                                <option value="nam">Nam</option>
                                <option value="nu">Nữ</option>
                                <option value="khac">Khác</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label>
                                <i class="fas fa-book"></i>
                                Môn học
                            </label>
                            <select name="subject">
                                <option value="">Tất cả môn học</option>
                                <option value="toan">Toán</option>
                                <option value="anh">Tiếng Anh</option>
                                <option value="ly">Vật Lý</option>
                                <option value="hoa">Hóa học</option>
                                <option value="van">Ngữ văn</option>
                                <option value="sinh">Sinh học</option>
                                <option value="su">Lịch sử</option>
                                <option value="dia">Địa lý</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label>
                                <i class="fas fa-graduation-cap"></i>
                                Lớp học
                            </label>
                            <select name="grade">
                                <option value="">Tất cả lớp</option>
                                <option value="1">Lớp 1</option>
                                <option value="2">Lớp 2</option>
                                <option value="3">Lớp 3</option>
                                <option value="4">Lớp 4</option>
                                <option value="5">Lớp 5</option>
                                <option value="6">Lớp 6</option>
                                <option value="7">Lớp 7</option>
                                <option value="8">Lớp 8</option>
                                <option value="9">Lớp 9</option>
                                <option value="10">Lớp 10</option>
                                <option value="11">Lớp 11</option>
                                <option value="12">Lớp 12</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label>
                                <i class="fas fa-dollar-sign"></i>
                                Mức học phí
                            </label>
                            <select name="fee_range">
                                <option value="">Tất cả mức phí</option>
                                <option value="under_1m">Dưới 1 triệu</option>
                                <option value="1m_2m">1-2 triệu</option>
                                <option value="2m_3m">2-3 triệu</option>
                                <option value="above_3m">Trên 3 triệu</option>
                            </select>
                        </div>
                    </div>

                    <div class="filter-actions">
                        <button type="button" class="reset-btn">
                            <i class="fas fa-undo"></i>
                            Đặt lại
                        </button>
                        <button type="button" class="apply-filter-btn" id="search-course">
                            <i class="fas fa-filter"></i>
                            Áp dụng bộ lọc
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section class="class-list-section">
            <h2>Các lớp mới chưa nhận</h2>
            <div class="class-list">

            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>


    <!-- custom js file link -->
    <script src="js/loadContent.js"></script>
    <script src="js/script.js"></script>
    <script src="js/forgot-password.js"></script>
    <script src="js/register-handler.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Apply buttons functionality
            const applyButtons = document.querySelectorAll(".apply-btn");
            applyButtons.forEach(button => {
                button.addEventListener("click", () => {
                    window.location.href = "apply_tutor.html";
                });
            });

            // Add subject icons automatically
            const classCards = document.querySelectorAll(".class-card h3");
            classCards.forEach(title => {
                const text = title.textContent;
                let icon = '📚'; // default

                if (text.includes('Toán')) icon = '🧮';
                else if (text.includes('Tiếng Anh')) icon = '🇺🇸';
                else if (text.includes('Lý')) icon = '⚡';
                else if (text.includes('Hóa')) icon = '🧪';
                else if (text.includes('Văn')) icon = '📖';
                else if (text.includes('Sinh')) icon = '🧬';
                else if (text.includes('Sử')) icon = '📜';
                else if (text.includes('Địa')) icon = '🌍';

                title.innerHTML = `<span class="subject-icon">${icon}</span> ${text}`;
            });

            // Search functionality
            //const searchBtn = document.querySelector('.search-btn');
            //const searchInput = document.querySelector('.search-input');

            //searchBtn.addEventListener('click', () => {
            //    // Implement search functionality
            //    console.log('Searching for:', searchInput.value);
            //});

            // Filter functionality
            const applyFilterBtn = document.querySelector('.apply-filter-btn');
            const resetBtn = document.querySelector('.reset-btn');

            applyFilterBtn.addEventListener('click', (e) => {
                e.preventDefault();
                // Implement filter functionality
                console.log('Applying filters...');
            });

            resetBtn.addEventListener('click', () => {
                // Reset all filters
                document.getElementById('filter-form').reset();
            });
        });
    </script>
</body>
</html>
